<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Retazos - Catálogo Virtual</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'catalogotodoretazos@gmail.com';
    const ADMIN_PASS = 'Bigotes202512';

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Gabardina 8 Oz Algodón',
        category: 'Gabardinas',
        unit: 'metro',
        price: 4500,
        composition: '100% Algodón',
        width: '1.50m',
        notes: 'Ideal para pantalones, chaquetas y delantales.',
        images: ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&q=80&w=600']
      },
      {
        id: '2',
        title: 'Lino Spandex Estampado',
        category: 'Planos',
        unit: 'metro',
        price: 5200,
        composition: '80% Lino / 20% Spandex',
        width: '1.45m',
        notes: 'Excelente caída, fresco y elastizado.',
        images: ['https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&q=80&w=600']
      }
    ];

    const INITIAL_CONFIG = {
      storeName: 'Todo Retazos',
      whatsapp: '5492984123456',
      logoUrl: '',
      description: 'Venta de telas por metro, kilo y retazos seleccionados.',
      address: 'Av. Rivadavia 1420, Ciudad de Regina',
      hours: 'Lun a Vie: 9:00 - 13:00 / 16:30 - 20:00',
      instagram: '@todoretazos_ok',
      facebook: 'TodoRetazosOficial',
      welcomeMessage: '¡Bienvenidos a nuestro catálogo virtual! Consultá disponibilidad y hacé tu pedido por WhatsApp.'
    };

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [config, setConfig] = useState(INITIAL_CONFIG);
      const [cart, setCart] = useState([]);
      const [view, setView] = useState('catalog');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [selectedUnit, setSelectedUnit] = useState('Todas');

      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [jsonInput, setJsonInput] = useState('');

      const [productForm, setProductForm] = useState({
        id: '', title: '', category: 'Planos', unit: 'metro', price: '', composition: '', width: '', notes: '', images: []
      });

      useEffect(() => {
        try {
          const savedP = localStorage.getItem('tr_products_v2');
          if (savedP) setProducts(JSON.parse(savedP));
          const savedC = localStorage.getItem('tr_config_v2');
          if (savedC) setConfig(JSON.parse(savedC));
        } catch(e) {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('tr_products_v2', JSON.stringify(products));
        } catch(e) {}
      }, [products]);

      useEffect(() => {
        try {
          localStorage.setItem('tr_config_v2', JSON.stringify(config));
        } catch(e) {}
      }, [config]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleFileUpload = (e, callback) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => callback(reader.result);
        reader.readAsDataURL(file);
      };

      const handleBulkJsonImport = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(jsonInput);
          const list = Array.isArray(parsed) ? parsed : (parsed.products || []);
          if (list.length === 0) {
            alert('El JSON está vacío o formato incorrecto.');
            return;
          }
          const formatted = list.map((p, idx) => ({
            id: String(p.id || Date.now() + idx),
            title: p.title || p.name || 'Producto',
            category: p.category || 'General',
            unit: p.unit || 'metro',
            price: parseFloat(p.price) || 0,
            composition: p.composition || '',
            width: p.width || '',
            notes: p.notes || p.description || '',
            images: Array.isArray(p.images) && p.images.length > 0 ? p.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
          }));
          setProducts(prev => [...formatted, ...prev]);
          setJsonInput('');
          alert(`¡Se importaron ${formatted.length} productos con éxito!`);
        } catch(err) {
          alert('Error al leer el JSON. Revisa la sintaxis.');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail.trim() === ADMIN_EMAIL && loginPass === ADMIN_PASS) {
          setIsAdmin(true);
          setLoginError('');
          setView('admin');
        } else {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.title || !productForm.price) {
          alert('Completa el título y el precio.');
          return;
        }
        const newProd = {
          ...productForm,
          price: parseFloat(productForm.price) || 0,
          images: productForm.images.length > 0 ? productForm.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
        };
        if (productForm.id) {
          setProducts(products.map(p => p.id === productForm.id ? newProd : p));
        } else {
          setProducts([{ ...newProd, id: String(Date.now()) }, ...products]);
        }
        setProductForm({ id: '', title: '', category: 'Planos', unit: 'metro', price: '', composition: '', width: '', notes: '', images: [] });
        alert('Producto guardado correctamente.');
      };

      const filteredProducts = products.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesUnit = selectedUnit === 'Todas' || p.unit === selectedUnit;
        return matchesSearch && matchesCategory && matchesUnit;
      });

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="bg-amber-800 text-white shadow-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setView('catalog'); setSelectedProduct(null); }}>
                {config.logoUrl ? (
                  <img src={config.logoUrl} alt="Logo" className="w-12 h-12 object-cover rounded-full border-2 border-amber-300" />
                ) : (
                  <div className="w-12 h-12 bg-amber-700 rounded-full flex items-center justify-center font-bold text-xl border-2 border-amber-300">TR</div>
                )}
                <div>
                  <h1 className="text-xl font-bold">{config.storeName}</h1>
                  <p className="text-xs text-amber-200 hidden sm:block">{config.description}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button onClick={() => setView('cart')} className="bg-amber-700 hover:bg-amber-600 px-3 py-2 rounded-lg text-sm flex items-center gap-2">
                  <span>🛒 Pedido</span>
                  {cart.length > 0 && <span className="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                </button>
                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setView('admin')} className="bg-emerald-600 px-3 py-2 rounded-lg text-sm">Admin</button>
                    <button onClick={() => { setIsAdmin(false); setView('catalog'); }} className="bg-red-700 px-3 py-2 rounded-lg text-sm">Salir</button>
                  </div>
                ) : (
                  <button onClick={() => setView('admin')} className="text-xs text-amber-200 underline">Acceso Admin</button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            {view === 'catalog' && !selectedProduct && (
              <div>
                {config.welcomeMessage && (
                  <div className="bg-amber-50 border-l-4 border-amber-800 p-4 mb-6 rounded-r-xl">
                    <p className="text-amber-900 text-sm md:text-base font-medium">{config.welcomeMessage}</p>
                  </div>
                )}

                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between">
                  <input 
                    type="text" 
                    placeholder="Buscar tela..." 
                    value={searchTerm} 
                    onChange={e => setSearchTerm(e.target.value)} 
                    className="w-full md:w-1/3 px-4 py-2 border rounded-lg text-sm"
                  />
                  <div className="flex gap-2">
                    <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
                      {categories.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <select value={selectedUnit} onChange={e => setSelectedUnit(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
                      <option value="Todas">Todas las unidades</option>
                      <option value="metro">Metro</option>
                      <option value="kilo">Kilo</option>
                      <option value="unidad">Unidad</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                  {filteredProducts.map(prod => (
                    <div key={prod.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="h-48 bg-gray-200 cursor-pointer relative" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>
                          <img src={prod.images[0]} alt="" className="w-full h-full object-cover" />
                          <span className="absolute top-2 right-2 bg-amber-800 text-white text-xs font-bold px-2 py-1 rounded">${prod.price} / {prod.unit}</span>
                        </div>
                        <div className="p-4">
                          <span className="text-xs text-amber-700 font-semibold uppercase">{prod.category}</span>
                          <h3 className="font-bold text-lg text-gray-800 cursor-pointer" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>{prod.title}</h3>
                          <p className="text-xs text-gray-500 mt-1">{prod.composition}</p>
                        </div>
                      </div>
                      <div className="p-4 pt-0 flex gap-2">
                        <button onClick={() => { setSelectedProduct(prod); setView('detail'); }} className="flex-1 border border-amber-800 text-amber-800 py-1.5 rounded-lg text-sm font-semibold">Ver Detalle</button>
                        <button onClick={() => setCart([...cart, { product: prod, quantity: 1 }])} className="bg-amber-800 text-white px-3 py-1.5 rounded-lg text-sm">+ 🛒</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'detail' && selectedProduct && (
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 max-w-3xl mx-auto">
                <button onClick={() => setView('catalog')} className="mb-4 text-amber-800 underline text-sm">← Volver</button>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <img src={selectedProduct.images[0]} alt="" className="w-full h-72 object-cover rounded-xl" />
                  <div>
                    <h2 className="text-2xl font-bold">{selectedProduct.title}</h2>
                    <p className="text-2xl font-bold text-amber-800 my-3">${selectedProduct.price} / {selectedProduct.unit}</p>
                    <p className="text-sm text-gray-600 mb-2"><strong>Composición:</strong> {selectedProduct.composition}</p>
                    <p className="text-sm text-gray-600 mb-4"><strong>Notas:</strong> {selectedProduct.notes}</p>
                    <button onClick={() => setCart([...cart, { product: selectedProduct, quantity: 1 }])} className="w-full bg-amber-800 text-white py-3 rounded-xl font-bold">Agregar al Pedido</button>
                  </div>
                </div>
              </div>
            )}

            {view === 'cart' && (
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 max-w-2xl mx-auto">
                <h2 className="text-2xl font-bold mb-4">Tu Pedido</h2>
                {cart.length === 0 ? <p className="text-gray-500">No hay productos en el pedido.</p> : (
                  <div className="space-y-4">
                    {cart.map((item, idx) => (
                      <div key={idx} className="flex justify-between border-b pb-2 text-sm">
                        <span>{item.product.title} (x{item.quantity})</span>
                        <span className="font-bold">${item.product.price * item.quantity}</span>
                      </div>
                    ))}
                    <button onClick={() => window.open(`https://wa.me/${config.whatsapp}?text=` + encodeURIComponent('Hola, quiero hacer un pedido'))} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Enviar Pedido por WhatsApp</button>
                  </div>
                )}
              </div>
            )}

            {view === 'admin' && (
              <div>
                {!isAdmin ? (
                  <div className="bg-white p-6 rounded-2xl shadow-md border max-w-md mx-auto">
                    <h2 className="text-xl font-bold mb-4 text-center">Acceso Admin</h2>
                    {loginError && <p className="text-red-600 text-sm mb-3">{loginError}</p>}
                    <form onSubmit={handleLogin} className="space-y-3">
                      <input type="email" placeholder="Correo" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border p-2 rounded text-sm" required />
                      <input type="password" placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full border p-2 rounded text-sm" required />
                      <button type="submit" className="w-full bg-amber-800 text-white py-2 rounded font-bold text-sm">Entrar</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border">
                      <h3 className="text-lg font-bold mb-3">Carga Masiva JSON</h3>
                      <form onSubmit={handleBulkJsonImport} className="space-y-2">
                        <textarea rows="3" placeholder="Pegar array JSON..." value={jsonInput} onChange={e => setJsonInput(e.target.value)} className="w-full border p-2 text-xs font-mono rounded"></textarea>
                        <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Importar</button>
                      </form>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border">
                      <h3 className="text-lg font-bold mb-3">Agregar Producto</h3>
                      <form onSubmit={handleSaveProduct} className="space-y-3">
                        <input type="text" placeholder="Título" value={productForm.title} onChange={e => setProductForm({...productForm, title: e.target.value})} className="w-full border p-2 text-sm rounded" required />
                        <input type="number" placeholder="Precio" value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} className="w-full border p-2 text-sm rounded" required />
                        <input type="file" accept="image/*" onChange={e => handleFileUpload(e, base64 => setProductForm({...productForm, images: [base64]}))} className="text-sm" />
                        <button type="submit" className="bg-amber-800 text-white px-4 py-2 rounded text-sm font-bold">Guardar Producto</button>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="bg-gray-800 text-gray-300 py-6 text-center text-xs">
            <p>© {new Date().getFullYear()} {config.storeName}</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
