      },
      {

        title: 'Lino Spandex Estampado',
        category: 'Planos',

        width: '1.45m',
        notes: 'Excelente caída, fresco y elastizado para mayor comodidad.',
        images: ['https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&q=80&w=600']
      },
      {
        id: '3',
        title: 'Retazo Jersey de Algodón Peinado',
        category: 'Puntos',
        unit: 'kilo',
        price: 8900,
        stock: true,
        composition: '100% Algodón',
        width: 'Rendimiento 3mts/kg aprox.',
        notes: 'Saldo de taller. Variedad de colores pastel en la pieza.',
        images: ['https://images.unsplash.com/photo-1528458876861-544fd1761a91?auto=format&fit=crop&q=80&w=600']
      }
    ];

    const INITIAL_CONFIG = {
      storeName: 'Todo Retazos',
      whatsapp: '5492984123456',
      logoUrl: '',
      description: 'Venta de telas por metro, kilo y retazos seleccionados.',
      address: 'Av. Rivadavia 1420, Ciudad de Regina',
      hours: 'Lun a Vie: 9:00 - 13:00 / 16:30 - 20:00 | Sáb: 9:30 - 13:30',
      instagram: '@todoretazos_ok',
      facebook: 'TodoRetazosOficial',
      welcomeMessage: '¡Bienvenidos a nuestro catálogo virtual! Consultá disponibilidad y hacé tu pedido por WhatsApp.'
    };

    function App() {
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('tr_products');
          return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
        } catch(e) { return INITIAL_PRODUCTS; }
      });

      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('tr_config');
          return saved ? JSON.parse(saved) : INITIAL_CONFIG;
        } catch(e) { return INITIAL_CONFIG; }
      });

      const [cart, setCart] = useState([]);
      const [view, setView] = useState('catalog');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [selectedUnit, setSelectedUnit] = useState('Todas');

      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [jsonInput, setJsonInput] = useState('');

      const [productForm, setProductForm] = useState({
        id: '',
        title: '',
        category: 'Planos',
        unit: 'metro',
        price: '',
        stock: true,
        composition: '',
        width: '',
        notes: '',
        images: []
      });

      useEffect(() => {
        try { localStorage.setItem('tr_products', JSON.stringify(products)); } catch(e) {}
      }, [products]);

      useEffect(() => {
        try { localStorage.setItem('tr_config', JSON.stringify(config)); } catch(e) {}
      }, [config]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [view, products, config]);

      const handleFileUpload = (e, callback) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        files.forEach(file => {
          const reader = new FileReader();
          reader.onloadend = () => callback(reader.result);
          reader.readAsDataURL(file);
        });
      };

      const handleBulkJsonImport = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(jsonInput);
          const list = Array.isArray(parsed) ? parsed : (parsed.products || []);
          
          if (!Array.isArray(list) || list.length === 0) {
            alert('El JSON debe ser una lista de productos válida.');
            return;
          }

          const formattedProducts = list.map((p, idx) => ({
            id: p.id ? String(p.id) : `prod-${Date.now()}-${idx}`,
            title: p.title || p.name || 'Producto',
            category: p.category || p.categoryId || 'General',
            unit: p.unit || 'metro',
            price: parseFloat(p.price) || 0,
            stock: p.stock !== undefined ? p.stock : true,
            composition: p.composition || '',
            width: p.width || '',
            notes: p.notes || p.description || '',
            images: Array.isArray(p.images) && p.images.length > 0 ? p.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
          }));

          setProducts(prev => [...formattedProducts, ...prev]);
          setJsonInput('');
          alert(`¡Se importaron ${formattedProducts.length} productos al catálogo!`);
        } catch (err) {
          alert('Error de sintaxis JSON. Revisa el formato.');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail === ADMIN_CREDENTIALS.email && loginPass === ADMIN_CREDENTIALS.password) {
          setIsAdmin(true);
          setLoginError('');
          setView('admin');
        } else {
          setLoginError('Credenciales incorrectas.');
        }
      };

      const handleLogout = () => {
        setIsAdmin(false);
        setView('catalog');
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.title || !productForm.price) {
          alert('Completa al menos el título y el precio.');
          return;
        }

        const formattedProduct = {
          ...productForm,
          price: parseFloat(productForm.price) || 0,
          images: productForm.images.length > 0 ? productForm.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
        };

        if (productForm.id) {
          setProducts(products.map(p => p.id === productForm.id ? formattedProduct : p));
        } else {
          setProducts([{ ...formattedProduct, id: Date.now().toString() }, ...products]);
        }

        resetProductForm();
        alert('Producto guardado.');
      };

      const handleEditProduct = (prod) => {
        setProductForm({ ...prod });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteProduct = (id) => {
        if (confirm('¿Eliminar este producto?')) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const resetProductForm = () => {
        setProductForm({
          id: '',
          title: '',
          category: 'Planos',
          unit: 'metro',
          price: '',
          stock: true,
          composition: '',
          width: '',
          notes: '',
          images: []
        });
      };

      const addToCart = (product, quantity = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.product.id === product.id ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, { product, quantity }];
        });
        alert(`Agregado: "${product.title}"`);
      };

      const updateCartQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const sendWhatsAppOrder = () => {
        if (cart.length === 0) return;
        let message = `Hola *${config.storeName}*, quisiera consultar por este pedido:\n\n`;
        let total = 0;

        cart.forEach((item, idx) => {
          const subtotal = item.product.price * item.quantity;
          total += subtotal;
          message += `${idx + 1}. *${item.product.title}*\n`;
          message += `   - Cantidad: ${item.quantity} ${item.product.unit}(s)\n`;
          message += `   - Precio unitario: $${item.product.price}\n`;
          message += `   - Subtotal: $${subtotal}\n\n`;
        });

        message += `*Total estimado: $${total}*\n\n¿Tienen stock?`;
        window.open(`https://wa.me/${config.whatsapp.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
      };

      const filteredProducts = products.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              (p.composition && p.composition.toLowerCase().includes(searchTerm.toLowerCase()));
        const matchesCategory = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesUnit = selectedUnit === 'Todas' || p.unit === selectedUnit;
        return matchesSearch && matchesCategory && matchesUnit;
      });

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="bg-amber-800 text-white shadow-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div 
                className="flex items-center gap-3 cursor-pointer" 
                onClick={() => { setView('catalog'); setSelectedProduct(null); }}
              >
                {config.logoUrl ? (
                  <img src={config.logoUrl} alt="Logo" className="w-12 h-12 object-cover rounded-full border-2 border-amber-300" />
                ) : (
                  <div className="w-12 h-12 bg-amber-700 rounded-full flex items-center justify-center font-bold text-xl border-2 border-amber-300">
                    TR
                  </div>
                )}
                <div>
                  <h1 className="text-xl font-bold tracking-wide">{config.storeName}</h1>
                  <p className="text-xs text-amber-200 hidden sm:block">{config.description}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setView('cart')}
                  className="relative bg-amber-700 hover:bg-amber-600 px-3 py-2 rounded-lg flex items-center gap-2 transition"
                >
                  <span>🛒 Pedido</span>
                  {cart.length > 0 && (
                    <span className="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                      {cart.reduce((a, b) => a + b.quantity, 0)}
                    </span>
                  )}
                </button>

                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setView('admin')}
                      className="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-sm font-semibold transition"
                    >
                      Admin
                    </button>
                    <button 
                      onClick={handleLogout}
                      className="bg-red-700 hover:bg-red-600 px-3 py-2 rounded-lg text-sm transition"
                    >
                      Salir
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setView('admin')}
                    className="text-xs text-amber-200 hover:text-white underline"
                  >
                    Acceso Admin
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            {view === 'catalog' && !selectedProduct && (
              <div>
                {config.welcomeMessage && (
                  <div className="bg-amber-50 border-l-4 border-amber-800 p-4 mb-6 rounded-
