<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Retazos - Catálogo Virtual & Telas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-50 text-stone-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'catalogotodoretazos@gmail.com';
    const ADMIN_PASS = 'Bigotes202512';

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Gabardina 8 Oz Algodón',
        category: 'Gabardinas',
        unit: 'metro',
        price: 4500,
        composition: '100% Algodón',
        width: '1.50m',
        notes: 'Ideal para pantalones, chaquetas y delantales. Alta resistencia.',
        images: ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&q=80&w=600']
      },
      {
        id: '2',
        title: 'Lino Spandex Estampado',
        category: 'Planos',
        unit: 'metro',
        price: 5200,
        composition: '80% Lino / 20% Spandex',
        width: '1.45m',
        notes: 'Excelente caída, fresco y elastizado para mayor confort.',
        images: ['https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&q=80&w=600']
      },
      {
        id: '3',
        title: 'Retazo Jersey de Algodón Peinado',
        category: 'Puntos',
        unit: 'kilo',
        price: 8900,
        composition: '100% Algodón',
        width: 'Rendimiento 3mts/kg aprox.',
        notes: 'Saldo de taller. Variedad de tonos pasteles en la pieza.',
        images: ['https://images.unsplash.com/photo-1528458876861-544fd1761a91?auto=format&fit=crop&q=80&w=600']
      }
    ];

    const INITIAL_CONFIG = {
      storeName: 'Todo Retazos',
      whatsapp: '5492984123456',
      logoUrl: '',
      description: 'Venta de telas, saldos y retazos seleccionados.',
      address: 'Av. Principal 1420, Local 5',
      hours: 'Lun a Vie: 9:00 - 13:00 / 16:30 - 20:00',
      instagram: 'https://instagram.com/todoretazos',
      instagramUser: '@todoretazos',
      facebook: 'https://facebook.com/TodoRetazosOficial',
      facebookUser: 'TodoRetazosOficial',
      welcomeMessage: '✨ ¡Bienvenidos a nuestro catálogo virtual! Consultá disponibilidad y hacé tu pedido directamente por WhatsApp.'
    };

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [config, setConfig] = useState(INITIAL_CONFIG);
      const [cart, setCart] = useState([]);
      const [view, setView] = useState('catalog');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [selectedUnit, setSelectedUnit] = useState('Todas');

      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [jsonInput, setJsonInput] = useState('');

      const [productForm, setProductForm] = useState({
        id: '', title: '', category: 'Planos', unit: 'metro', price: '', composition: '', width: '', notes: '', images: []
      });

      useEffect(() => {
        try {
          const savedP = localStorage.getItem('tr_products_v3');
          if (savedP) setProducts(JSON.parse(savedP));
          const savedC = localStorage.getItem('tr_config_v3');
          if (savedC) setConfig(JSON.parse(savedC));
        } catch(e) {}
      }, []);

      useEffect(() => {
        try { localStorage.setItem('tr_products_v3', JSON.stringify(products)); } catch(e) {}
      }, [products]);

      useEffect(() => {
        try { localStorage.setItem('tr_config_v3', JSON.stringify(config)); } catch(e) {}
      }, [config]);

      const handleFileUpload = (e, callback) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => callback(reader.result);
        reader.readAsDataURL(file);
      };

      const handleBulkJsonImport = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(jsonInput);
          const list = Array.isArray(parsed) ? parsed : (parsed.products || []);
          if (list.length === 0) {
            alert('El JSON está vacío o no es válido.');
            return;
          }
          const formatted = list.map((p, idx) => ({
            id: String(p.id || Date.now() + idx),
            title: p.title || p.name || 'Producto',
            category: p.category || 'General',
            unit: p.unit || 'metro',
            price: parseFloat(p.price) || 0,
            composition: p.composition || '',
            width: p.width || '',
            notes: p.notes || p.description || '',
            images: Array.isArray(p.images) && p.images.length > 0 ? p.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
          }));
          setProducts(prev => [...formatted, ...prev]);
          setJsonInput('');
          alert(`¡Se importaron ${formatted.length} productos con éxito!`);
        } catch(err) {
          alert('Error al procesar el JSON. Revisa la sintaxis.');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail.trim() === ADMIN_EMAIL && loginPass === ADMIN_PASS) {
          setIsAdmin(true);
          setLoginError('');
          setView('admin');
        } else {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.title || !productForm.price) {
          alert('Completa el título y el precio.');
          return;
        }
        const newProd = {
          ...productForm,
          price: parseFloat(productForm.price) || 0,
          images: productForm.images.length > 0 ? productForm.images : ['https://via.placeholder.com/400x300?text=Sin+Imagen']
        };
        if (productForm.id) {
          setProducts(products.map(p => p.id === productForm.id ? newProd : p));
        } else {
          setProducts([{ ...newProd, id: String(Date.now()) }, ...products]);
        }
        setProductForm({ id: '', title: '', category: 'Planos', unit: 'metro', price: '', composition: '', width: '', notes: '', images: [] });
        alert('¡Producto guardado con éxito!');
      };

      const filteredProducts = products.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) || (p.composition && p.composition.toLowerCase().includes(searchTerm.toLowerCase()));
        const matchesCategory = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesUnit = selectedUnit === 'Todas' || p.unit === selectedUnit;
        return matchesSearch && matchesCategory && matchesUnit;
      });

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      return (
        <div className="min-h-screen flex flex-col justify-between bg-stone-50">
          {/* HEADER MODERNO */}
          <header className="bg-amber-900 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer group" onClick={() => { setView('catalog'); setSelectedProduct(null); }}>
                {config.logoUrl ? (
                  <img src={config.logoUrl} alt="Logo" className="w-12 h-12 object-cover rounded-full border-2 border-amber-400 shadow-md" />
                ) : (
                  <div className="w-12 h-12 bg-amber-800 rounded-full flex items-center justify-center font-bold text-xl border-2 border-amber-400 shadow-md">TR</div>
                )}
                <div>
                  <h1 className="text-2xl font-serif tracking-wide group-hover:text-amber-200 transition">{config.storeName}</h1>
                  <p className="text-xs text-amber-200 hidden sm:block">{config.description}</p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                {/* Redes Sociales en Header */}
                <div className="hidden md:flex items-center gap-3 border-r border-amber-800 pr-4">
                  {config.instagram && (
                    <a href={config.instagram} target="_blank" rel="noopener noreferrer" className="bg-amber-800 hover:bg-amber-700 p-2 rounded-full text-amber-200 hover:text-white transition shadow-xs text-xs flex items-center gap-1">
                      📸 <span className="hidden lg:inline">{config.instagramUser}</span>
                    </a>
                  )}
                  {config.facebook && (
                    <a href={config.facebook} target="_blank" rel="noopener noreferrer" className="bg-amber-800 hover:bg-amber-700 p-2 rounded-full text-amber-200 hover:text-white transition shadow-xs text-xs flex items-center gap-1">
                      📘 <span className="hidden lg:inline">Facebook</span>
                    </a>
                  )}
                </div>

                <button onClick={() => setView('cart')} className="bg-amber-700 hover:bg-amber-600 px-4 py-2 rounded-xl text-sm font-medium shadow-md flex items-center gap-2 transition">
                  <span>🛒 Pedido</span>
                  {cart.length > 0 && <span className="bg-rose-500 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow-xs">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                </button>

                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setView('admin')} className="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-xl text-sm font-semibold shadow-md transition">Admin</button>
                    <button onClick={() => { setIsAdmin(false); setView('catalog'); }} className="bg-rose-700 hover:bg-rose-600 px-3 py-2 rounded-xl text-sm font-semibold shadow-md transition">Salir</button>
                  </div>
                ) : (
                  <button onClick={() => setView('admin')} className="text-xs text-amber-300 hover:text-white underline transition">Acceso Admin</button>
                )}
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
            {view === 'catalog' && !selectedProduct && (
              <div>
                {config.welcomeMessage && (
                  <div className="bg-amber-100/70 border-l-4 border-amber-800 p-4 mb-8 rounded-r-2xl shadow-xs">
                    <p className="text-amber-950 text-sm md:text-base font-medium">{config.welcomeMessage}</p>
                  </div>
                )}

                {/* Filtros y Buscador */}
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
                  <div className="w-full md:w-1/3 relative">
                    <input 
                      type="text" 
                      placeholder="🔍 Buscar por nombre o composición..." 
                      value={searchTerm} 
                      onChange={e => setSearchTerm(e.target.value)} 
                      className="w-full px-4 py-2.5 pl-4 border border-stone-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800 shadow-xs"
                    />
                  </div>

                  <div className="flex flex-wrap gap-3 w-full md:w-auto">
                    <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="px-4 py-2.5 border border-stone-300 rounded-xl bg-white text-sm shadow-xs focus:ring-2 focus:ring-amber-800">
                      {categories.map(c => <option key={c} value={c}>{c === 'Todas' ? 'Todas las Categorías' : c}</option>)}
                    </select>
                    <select value={selectedUnit} onChange={e => setSelectedUnit(e.target.value)} className="px-4 py-2.5 border border-stone-300 rounded-xl bg-white text-sm shadow-xs focus:ring-2 focus:ring-amber-800">
                      <option value="Todas">Todas las Unidades</option>
                      <option value="metro">Por Metro</option>
                      <option value="kilo">Por Kilo</option>
                      <option value="unidad">Por Unidad</option>
                    </select>
                  </div>
                </div>

                {/* Listado de Productos */}
                {filteredProducts.length === 0 ? (
                  <div className="text-center py-16 text-stone-500 bg-white rounded-2xl border border-stone-200">
                    <p className="text-lg font-medium">No se encontraron telas con esos filtros.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    {filteredProducts.map(prod => (
                      <div key={prod.id} className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden hover:shadow-lg transition duration-300 flex flex-col justify-between group">
                        <div>
                          <div className="h-52 bg-stone-100 cursor-pointer relative overflow-hidden" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>
                            <img src={prod.images[0]} alt={prod.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                            <span className="absolute top-3 right-3 bg-amber-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow-md">
                              ${prod.price} / {prod.unit}
                            </span>
                          </div>
                          <div className="p-5">
                            <span className="text-xs text-amber-800 font-bold uppercase tracking-wider">{prod.category}</span>
                            <h3 className="font-serif font-bold text-lg text-stone-900 cursor-pointer mt-1 group-hover:text-amber-800 transition" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>
                              {prod.title}
                            </h3>
                            <p className="text-xs text-stone-500 mt-1 line-clamp-1">{prod.composition || 'Consultar composición'}</p>
                          </div>
                        </div>

                        <div className="p-5 pt-0 flex gap-2">
                          <button onClick={() => { setSelectedProduct(prod); setView('detail'); }} className="flex-1 border border-amber-900 text-amber-900 py-2 rounded-xl text-sm font-semibold hover:bg-amber-50 transition">
                            Ver Detalle
                          </button>
                          <button onClick={() => { setCart(prev => { const ext = prev.find(i => i.product.id === prod.id); if(ext) return prev.map(i => i.product.id === prod.id ? {...i, quantity: i.quantity+1} : i); return [...prev, {product: prod, quantity: 1}]; }); alert(`Agregado al pedido: ${prod.title}`); }} className="bg-amber-900 hover:bg-amber-950 text-white px-3.5 py-2 rounded-xl text-sm font-semibold shadow-xs transition">
                            + 🛒
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* DETALLE DE PRODUCTO */}
            {view === 'detail' && selectedProduct && (
              <div className="bg-white rounded-3xl shadow-md border border-stone-200 p-8 max-w-4xl mx-auto">
                <button onClick={() => setView('catalog')} className="mb-6 text-amber-900 hover:underline text-sm font-semibold flex items-center gap-1">
                  ← Volver al catálogo
                </button>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                  <div className="rounded-2xl overflow-hidden shadow-md border border-stone-100">
                    <img src={selectedProduct.images[0]} alt={selectedProduct.title} className="w-full h-80 object-cover" />
                  </div>
                  <div className="flex flex-col justify-between">
                    <div>
                      <span className="text-xs bg-amber-100 text-amber-900 px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                        {selectedProduct.category}
                      </span>
                      <h2 className="text-3xl font-serif font-bold text-stone-900 mt-3">{selectedProduct.title}</h2>
                      <p className="text-3xl font-bold text-amber-900 my-4">
                        ${selectedProduct.price} <span className="text-sm font-normal text-stone-500">por {selectedProduct.unit}</span>
                      </p>

                      <div className="space-y-2.5 text-sm text-stone-600 border-t border-b border-stone-200 py-4 my-4">
                        <p><strong>Composición:</strong> {selectedProduct.composition || 'No especificada'}</p>
                        <p><strong>Ancho / Rendimiento:</strong> {selectedProduct.width || 'No especificado'}</p>
                        <p><strong>Detalles:</strong> {selectedProduct.notes || 'Sin notas adicionales.'}</p>
                      </div>
                    </div>

                    <button onClick={() => { setCart(prev => [...prev, {product: selectedProduct, quantity: 1}]); alert('¡Agregado al pedido!'); }} className="w-full bg-amber-900 hover:bg-amber-950 text-white font-bold py-3.5 rounded-2xl shadow-md transition">
                      Agregar al Pedido por WhatsApp
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* CARRITO / PEDIDO */}
            {view === 'cart' && (
              <div className="bg-white rounded-3xl shadow-md border border-stone-200 p-8 max-w-2xl mx-auto">
                <h2 className="text-2xl font-serif font-bold text-stone-900 mb-6 border-b border-stone-200 pb-3">Tu Lista de Pedido</h2>
                {cart.length === 0 ? (
                  <div className="text-center py-8">
                    <p className="text-stone-500 mb-4">No hay productos seleccionados todavía.</p>
                    <button onClick={() => setView('catalog')} className="bg-amber-900 text-white px-6 py-2.5 rounded-xl font-semibold text-sm">Explorar Telas</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cart.map((item, idx) => (
                      <div key={idx} className="flex justify-between items-center border-b border-stone-100 pb-3 text-sm">
                        <div>
                          <p className="font-bold text-stone-900">{item.product.title}</p>
                          <p className="text-xs text-stone-500">Cantidad: {item.quantity} {item.product.unit}(s)</p>
                        </div>
                        <span className="font-bold text-amber-900">${item.product.price * item.quantity}</span>
                      </div>
                    ))}
                    <div className="pt-4 flex justify-between text-lg font-bold text-stone-900">
                      <span>Total estimado:</span>
                      <span className="text-amber-900">${cart.reduce((sum, i) => sum + (i.product.price * i.quantity), 0)}</span>
                    </div>
                    <button onClick={() => {
                      let msg = `Hola *${config.storeName}*, me gustaría consultar por el siguiente pedido:\n\n`;
                      cart.forEach((i, idx) => { msg += `${idx+1}. *${i.product.title}* - Cantidad: ${i.quantity} ${i.product.unit}(s) ($${i.product.price * i.quantity})\n`; });
                      msg += `\n¿Tienen disponibilidad?`;
                      window.open(`https://wa.me/${config.whatsapp.replace(/[^0-9]/g, '')}?text=` + encodeURIComponent(msg), '_blank');
                    }} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3.5 rounded-2xl font-bold shadow-md transition flex items-center justify-center gap-2 mt-4">
                      💬 Enviar Consulta a WhatsApp
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PANEL ADMIN */}
            {view === 'admin' && (
              <div className="max-w-3xl mx-auto space-y-6">
                {!isAdmin ? (
                  <div className="bg-white p-8 rounded-3xl shadow-md border border-stone-200 max-w-md mx-auto">
                    <h2 className="text-2xl font-serif font-bold mb-4 text-center text-stone-900">Acceso Administrador</h2>
                    {loginError && <p className="text-rose-600 text-xs mb-4 bg-rose-50 p-2.5 rounded-xl">{loginError}</p>}
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-stone-600 uppercase mb-1">Correo Electrónico</label>
                        <input type="email" placeholder="Correo" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border border-stone-300 p-3 rounded-xl text-sm" required />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-stone-600 uppercase mb-1">Contraseña</label>
                        <input type="password" placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full border border-stone-300 p-3 rounded-xl text-sm" required />
                      </div>
                      <button type="submit" className="w-full bg-amber-900 hover:bg-amber-950 text-white py-3 rounded-xl font-bold text-sm shadow-md transition">Ingresar al Panel</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* CONFIGURAR REDES Y LOCAL */}
                    <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm">
                      <h3 className="text-lg font-bold mb-4 text-stone-900">⚙️ Configuración y Redes Sociales</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div>
                          <label className="block text-xs font-semibold text-stone-500 uppercase">Enlace de Instagram</label>
                          <input type="text" value={config.instagram} onChange={e => setConfig({...config, instagram: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-stone-500 uppercase">Enlace de Facebook</label>
                          <input type="text" value={config.facebook} onChange={e => setConfig({...config, facebook: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-stone-500 uppercase">WhatsApp (sin +)</label>
                          <input type="text" value={config.whatsapp} onChange={e => setConfig({...config, whatsapp: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-stone-500 uppercase">Dirección Física</label>
                          <input type="text" value={config.address} onChange={e => setConfig({...config, address: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" />
                        </div>
                      </div>
                    </div>

                    {/* CARGA MASIVA JSON */}
                    <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm">
                      <h3 className="text-lg font-bold mb-2 text-stone-900">📥 Importar Catálogo Masivo (JSON)</h3>
                      <form onSubmit={handleBulkJsonImport} className="space-y-3">
                        <textarea rows="3" placeholder='[{"title":"Tela Nova","price":2000,"unit":"metro","category":"Planos"}]' value={jsonInput} onChange={e => setJsonInput(e.target.value)} className="w-full border border-stone-300 p-3 text-xs font-mono rounded-xl"></textarea>
                        <button type="submit" className="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-xs">Cargar Productos</button>
                      </form>
                    </div>

                    {/* AGREGAR PRODUCTO */}
                    <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm">
                      <h3 className="text-lg font-bold mb-4 text-stone-900">➕ Agregar Producto Individual</h3>
                      <form onSubmit={handleSaveProduct} className="space-y-4 text-sm">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <input type="text" placeholder="Título de la tela *" value={productForm.title} onChange={e => setProductForm({...productForm, title: e.target.value})} className="border p-2.5 rounded-xl" required />
                          <input type="number" placeholder="Precio ($) *" value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} className="border p-2.5 rounded-xl" required />
                          <input type="text" placeholder="Categoría (Ej: Gabardinas, Planos)" value={productForm.category} onChange={e => setProductForm({...productForm, category: e.target.value})} className="border p-2.5 rounded-xl" />
                          <input type="text" placeholder="Composición (Ej: 100% Algodón)" value={productForm.composition} onChange={e => setProductForm({...productForm, composition: e.target.value})} className="border p-2.5 rounded-xl" />
                        </div>
                        <input type="file" accept="image/*" onChange={e => handleFileUpload(e, base64 => setProductForm({...productForm, images: [base64]}))} className="text-xs" />
                        <button type="submit" className="bg-amber-900 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md">Guardar en Catálogo</button>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* FOOTER ESTETICO CON REDES */}
          <footer className="bg-stone-900 text-stone-300 py-12 border-t border-stone-800 mt-16">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
              <div>
                <h4 className="text-white font-serif font-bold text-lg mb-2">{config.storeName}</h4>
                <p className="text-sm text-stone-400">{config.description}</p>
              </div>
              <div>
                <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3">Contacto & Ubicación</h4>
                <p className="text-sm mb-1.5">📍 {config.address}</p>
                <p className="text-sm mb-1.5">🕒 {config.hours}</p>
                <p className="text-sm">💬 WhatsApp: +{config.whatsapp}</p>
              </div>
              <div>
                <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3">Seguinos en Redes</h4>
                <div className="flex flex-col gap-2 text-sm">
                  {config.instagram && <a href={config.instagram} target="_blank" rel="noopener noreferrer" className="hover:text-amber-300 transition">📸 Instagram: {config.instagramUser}</a>}
                  {config.facebook && <a href={config.facebook} target="_blank" rel="noopener noreferrer" className="hover:text-amber-300 transition">📘 Facebook Oficial</a>}
                </div>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-stone-500 border-t border-stone-800 mt-10 pt-6">
              <p>© {new Date().getFullYear()} {config.storeName} - Todos los derechos reservados.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
