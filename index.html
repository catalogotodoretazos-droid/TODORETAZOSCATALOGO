<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Retazos - Catálogo Virtual</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-purple-50/40 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBscBd2y8N5raZTsrKxikyyc3v4_dW2KBo",
      authDomain: "catalogotodoretazos-e6b8f.firebaseapp.com",
      projectId: "catalogotodoretazos-e6b8f",
      storageBucket: "catalogotodoretazos-e6b8f.firebasestorage.app",
      messagingSenderId: "525213525334",
      appId: "1:525213525334:web:942ed8a3c55065ce1f22f7",
      measurementId: "G-G4NR9KKRH4"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const ADMIN_EMAIL = 'catalogotodoretazos@gmail.com';
    const ADMIN_PASS = 'Bigotes202512';

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Gabardina 8 Oz Algodón',
        category: 'Gabardinas',
        unit: 'metro',
        price: 4500,
        stock: true,
        composition: '100% Algodón',
        width: '1.50m',
        notes: 'Ideal para pantalones, chaquetas y delantales.',
        images: ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&q=80&w=600']
      }
    ];

    const INITIAL_CONFIG = {
      storeName: 'Todo Retazos',
      whatsapp: '5492984123456',
      logoUrl: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=200',
      description: 'Venta de telas, saldos y retazos seleccionados.',
      address: 'Yapeyú Sur 381, Villa Regina',
      hours: 'Lun a Vie: 8:30 - 12:30 / 16:00 - 19:30',
      instagram: 'https://instagram.com/todoretazos.vr25',
      facebook: 'https://facebook.com/TodoRetazosOficial',
      welcomeMessage: '✨ ¡Bienvenidos a nuestro catálogo virtual! Consultá disponibilidad y realizá tu pedido directamente por WhatsApp.',
      storeImages: [
        'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1200'
      ]
    };

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [config, setConfig] = useState(INITIAL_CONFIG);
      const [cart, setCart] = useState([]);
      const [view, setView] = useState('catalog');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [selectedUnit, setSelectedUnit] = useState('Todas');

      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [jsonInput, setJsonInput] = useState('');
      const [currentSlide, setCurrentSlide] = useState(0);

      const [productForm, setProductForm] = useState({
        id: '', title: '', category: 'Planos', unit: 'kilo', price: '', stock: true, composition: '', width: '', notes: '', images: ['']
      });

      // Sincronización robusta con Firestore en tiempo real
      useEffect(() => {
        // Cargar productos
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          if (!snapshot.empty) {
            const prods = [];
            snapshot.forEach(doc => prods.push({ id: doc.id, ...doc.data() }));
            setProducts(prods);
          } else {
            // Si Firestore está totalmente vacío, inicializamos con los productos por defecto
            INITIAL_PRODUCTS.forEach(p => db.collection('products').doc(p.id).set(p));
          }
        }, error => {
          console.error("Error al leer productos:", error);
        });

        // Cargar configuración general del local
        const unsubConfig = db.collection('settings').doc('storeConfig').onSnapshot(doc => {
          if (doc.exists) {
            setConfig(doc.data());
          } else {
            db.collection('settings').doc('storeConfig').set(INITIAL_CONFIG);
          }
        }, error => {
          console.error("Error al leer configuración:", error);
        });

        return () => {
          unsubProducts();
          unsubConfig();
        };
      }, []);

      useEffect(() => {
        if (!config.storeImages || config.storeImages.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentSlide(prev => (prev + 1) % config.storeImages.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [config.storeImages]);

      const saveConfigToCloud = (newConfig) => {
        setConfig(newConfig);
        db.collection('settings').doc('storeConfig').set(newConfig)
          .then(() => alert('¡Configuración guardada y sincronizada en la nube!'))
          .catch(err => alert('Error al guardar: ' + err.message));
      };

      const handleBulkJsonImport = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(jsonInput);
          const list = Array.isArray(parsed) ? parsed : (parsed.products || []);
          if (list.length === 0) {
            alert('El JSON está vacío o no es válido.');
            return;
          }
          list.forEach((p, idx) => {
            const id = String(p.id || Date.now() + idx);
            const formatted = {
              id,
              title: p.title || 'Producto',
              category: p.category || 'General',
              unit: p.unit || 'kilo',
              price: parseFloat(p.price) || 0,
              stock: p.stock !== undefined ? Boolean(p.stock) : true,
              composition: p.composition || '',
              width: p.width || '',
              notes: p.notes || '',
              images: Array.isArray(p.images) && p.images.length > 0 ? p.images : ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&q=80&w=600']
            };
            db.collection('products').doc(id).set(formatted);
          });
          setJsonInput('');
          alert('¡Carga masiva sincronizada en la nube con éxito para todos!');
        } catch(err) {
          alert('Error al procesar el JSON. Revisa la sintaxis.');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail.trim() === ADMIN_EMAIL && loginPass === ADMIN_PASS) {
          setIsAdmin(true);
          setLoginError('');
          setView('admin');
        } else {
          setLoginError('Correo o contraseña incorrectos.');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.title || !productForm.price) {
          alert('Completa al menos el título y el precio.');
          return;
        }
        const id = productForm.id ? productForm.id : String(Date.now());
        const newProd = {
          ...productForm,
          id,
          price: parseFloat(productForm.price) || 0,
          images: productForm.images.filter(img => img.trim() !== '').length > 0 
            ? productForm.images.filter(img => img.trim() !== '') 
            : ['https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&q=80&w=600']
        };

        db.collection('products').doc(id).set(newProd)
          .then(() => {
            resetProductForm();
            alert('¡Producto guardado y actualizado en la nube para todos!');
          })
          .catch(err => alert('Error al guardar producto: ' + err.message));
      };

      const handleEditProduct = (prod) => {
        setProductForm({ ...prod });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const toggleStock = (id, currentStock) => {
        db.collection('products').doc(id).update({ stock: !currentStock })
          .catch(err => alert('Error al actualizar stock: ' + err.message));
      };

      const handleDeleteProduct = (id) => {
        if (confirm('¿Estás seguro de eliminar este producto?')) {
          db.collection('products').doc(id).delete()
            .catch(err => alert('Error al eliminar: ' + err.message));
        }
      };

      const resetProductForm = () => {
        setProductForm({
          id: '', title: '', category: 'Planos', unit: 'kilo', price: '', stock: true, composition: '', width: '', notes: '', images: ['']
        });
      };

      const filteredProducts = products.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'Todas' || p.category === selectedCategory;
        const matchesUnit = selectedUnit === 'Todas' || p.unit === selectedUnit;
        return matchesSearch && matchesCategory && matchesUnit;
      });

      const categories = ['Todas', ...new Set(products.map(p => p.category))];

      return (
        <div className="min-h-screen flex flex-col justify-between bg-purple-50/30">
          <header className="bg-gradient-to-r from-purple-900 via-indigo-900 to-purple-800 text-white shadow-lg sticky top-0 z-50 border-b border-purple-700/50">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer group" onClick={() => { setView('catalog'); setSelectedProduct(null); }}>
                {config.logoUrl ? (
                  <img src={config.logoUrl} alt="Logo" className="w-12 h-12 object-cover rounded-full border-2 border-purple-300 shadow-md" />
                ) : (
                  <div className="w-12 h-12 bg-purple-700/80 rounded-full flex items-center justify-center font-bold text-xl border-2 border-purple-300/80 shadow-md">TR</div>
                )}
                <div>
                  <h1 className="text-2xl font-serif tracking-wide">{config.storeName}</h1>
                  <p className="text-xs text-purple-200/80 hidden sm:block">{config.description}</p>
                </div>
              </div>

              <div className="flex items-center gap-3 md:gap-4">
                <button onClick={() => setView('cart')} className="bg-purple-700 hover:bg-purple-600 px-4 py-2 rounded-xl text-sm font-medium shadow-md flex items-center gap-2 transition border border-purple-500/30">
                  <span>🛒 Pedido</span>
                  {cart.length > 0 && <span className="bg-pink-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                </button>

                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setView('admin')} className="bg-emerald-600 hover:bg-emerald-500 px-3.5 py-2 rounded-xl text-sm font-semibold">Panel Admin</button>
                    <button onClick={() => { setIsAdmin(false); setView('catalog'); }} className="bg-rose-700 hover:bg-rose-600 px-3.5 py-2 rounded-xl text-sm font-semibold">Salir</button>
                  </div>
                ) : (
                  <button onClick={() => setView('admin')} className="text-xs text-purple-200 hover:text-white underline">Acceso Admin</button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            {view === 'catalog' && !selectedProduct && (
              <div>
                {config.storeImages && config.storeImages.length > 0 && (
                  <div className="relative w-full h-64 md:h-96 rounded-3xl overflow-hidden shadow-xl mb-8 border border-purple-200 bg-purple-950">
                    <img src={config.storeImages[currentSlide]} alt="Local" className="w-full h-full object-cover transition duration-700 ease-in-out" />
                    <div className="absolute inset-0 bg-gradient-to-t from-purple-950/80 via-transparent to-transparent flex items-end p-6">
                      <div>
                        <span className="bg-purple-700 text-white text-xs font-bold px-3 py-1 rounded-full uppercase">Nuestro Local</span>
                        <h2 className="text-white font-serif text-2xl md:text-3xl font-bold mt-2">{config.storeName}</h2>
                        <p className="text-purple-200 text-xs md:text-sm">{config.address}</p>
                      </div>
                    </div>
                  </div>
                )}

                {config.welcomeMessage && (
                  <div className="bg-purple-100/80 border-l-4 border-purple-700 p-4 mb-8 rounded-r-2xl shadow-xs">
                    <p className="text-purple-950 text-sm md:text-base font-medium">{config.welcomeMessage}</p>
                  </div>
                )}

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-purple-100 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
                  <input type="text" placeholder="🔍 Buscar telas..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full md:w-1/3 px-4 py-2.5 border border-purple-200 rounded-xl text-sm focus:ring-2 focus:ring-purple-600" />
                  <div className="flex flex-wrap gap-3 w-full md:w-auto">
                    <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="px-4 py-2.5 border border-purple-200 rounded-xl bg-white text-sm">
                      {categories.map(c => <option key={c} value={c}>{c === 'Todas' ? 'Todas las Categorías' : c}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                  {filteredProducts.map(prod => (
                    <div key={prod.id} className="bg-white rounded-2xl shadow-sm border border-purple-100 overflow-hidden flex flex-col justify-between group">
                      <div>
                        <div className="h-52 bg-purple-50 cursor-pointer relative overflow-hidden" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>
                          <img src={prod.images[0]} alt={prod.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          <span className="absolute top-3 right-3 bg-purple-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow-md">${prod.price} / {prod.unit}</span>
                          {!prod.stock && <span className="absolute top-3 left-3 bg-rose-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">Agotado</span>}
                        </div>
                        <div className="p-5">
                          <span className="text-xs text-purple-800 font-bold uppercase">{prod.category}</span>
                          <h3 className="font-serif font-bold text-lg text-slate-900 cursor-pointer mt-1" onClick={() => { setSelectedProduct(prod); setView('detail'); }}>{prod.title}</h3>
                          <p className="text-xs text-slate-500 mt-1">{prod.composition}</p>
                        </div>
                      </div>
                      <div className="p-5 pt-0 flex gap-2">
                        <button onClick={() => { setSelectedProduct(prod); setView('detail'); }} className="flex-1 border border-purple-800 text-purple-800 py-2 rounded-xl text-sm font-semibold">Ver Detalle</button>
                        <button disabled={!prod.stock} onClick={() => { setCart([...cart, {product: prod, quantity: 1}]); alert('Agregado al pedido'); }} className={`px-3.5 py-2 rounded-xl text-sm font-semibold ${prod.stock ? 'bg-purple-800 text-white' : 'bg-slate-200 text-slate-400'}`}>+ 🛒</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'detail' && selectedProduct && (
              <div className="bg-white rounded-3xl shadow-md border border-purple-100 p-8 max-w-4xl mx-auto">
                <button onClick={() => setView('catalog')} className="mb-6 text-purple-800 underline text-sm font-semibold">← Volver</button>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                  <img src={selectedProduct.images[0]} alt="" className="w-full h-80 object-cover rounded-2xl" />
                  <div>
                    <h2 className="text-3xl font-serif font-bold">{selectedProduct.title}</h2>
                    <p className="text-3xl font-bold text-purple-950 my-4">${selectedProduct.price} / {selectedProduct.unit}</p>
                    <p className="text-sm text-slate-600 mb-2"><strong>Composición:</strong> {selectedProduct.composition}</p>
                    <p className="text-sm text-slate-600 mb-4"><strong>Notas:</strong> {selectedProduct.notes}</p>
                    <button disabled={!selectedProduct.stock} onClick={() => { setCart([...cart, {product: selectedProduct, quantity: 1}]); alert('Agregado'); }} className="w-full bg-purple-800 text-white py-3.5 rounded-2xl font-bold">Agregar al Pedido</button>
                  </div>
                </div>
              </div>
            )}

            {view === 'cart' && (
              <div className="bg-white rounded-3xl shadow-md border border-purple-100 p-8 max-w-2xl mx-auto">
                <h2 className="text-2xl font-serif font-bold mb-6">Tu Pedido</h2>
                {cart.length === 0 ? <p className="text-slate-500">No hay productos.</p> : (
                  <div className="space-y-4">
                    {cart.map((item, idx) => (
                      <div key={idx} className="flex justify-between border-b pb-2 text-sm">
                        <span>{item.product.title} (x{item.quantity})</span>
                        <span className="font-bold">${item.product.price * item.quantity}</span>
                      </div>
                    ))}
                    <button onClick={() => {
                      let msg = `Hola *${config.storeName}*, quiero consultar por este pedido:\n\n`;
                      cart.forEach((i, idx) => { msg += `${idx+1}. *${i.product.title}* - Cantidad: ${i.quantity}\n`; });
                      window.open(`https://wa.me/${config.whatsapp}?text=` + encodeURIComponent(msg), '_blank');
                    }} className="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold">Enviar Pedido por WhatsApp</button>
                  </div>
                )}
              </div>
            )}

            {view === 'admin' && (
              <div className="max-w-5xl mx-auto space-y-8">
                {!isAdmin ? (
                  <div className="bg-white p-8 rounded-3xl shadow-md border border-purple-100 max-w-md mx-auto">
                    <h2 className="text-2xl font-serif font-bold mb-4 text-center">Acceso Admin</h2>
                    {loginError && <p className="text-rose-600 text-xs mb-4">{loginError}</p>}
                    <form onSubmit={handleLogin} className="space-y-4">
                      <input type="email" placeholder="Correo" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border p-3 rounded-xl text-sm" required />
                      <input type="password" placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full border p-3 rounded-xl text-sm" required />
                      <button type="submit" className="w-full bg-purple-800 text-white py-3 rounded-xl font-bold text-sm">Entrar</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-8">
                    
                    {/* GESTIÓN DE CONFIGURACIÓN Y LOGO */}
                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-purple-100 shadow-sm space-y-4">
                      <h3 className="text-xl font-serif font-bold text-purple-950">⚙️ Configuración y Enlace de Logo</h3>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">URL de la Imagen del Logo</label>
                        <input type="text" placeholder="https://ejemplo.com/logo.jpg" value={config.logoUrl} onChange={e => setConfig({...config, logoUrl: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" />
                      </div>
                      <button onClick={() => saveConfigToCloud(config)} className="bg-purple-800 text-white px-5 py-2.5 rounded-xl font-bold text-sm">Guardar Configuración General</button>
                    </div>

                    {/* GESTIÓN DE CATÁLOGO */}
                    <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xl font-bold">Catálogo Nube ({products.length})</h3>
                        <button onClick={resetProductForm} className="bg-purple-800 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Producto</button>
                      </div>
                      <table className="w-full text-left border-collapse text-sm">
                        <thead>
                          <tr className="border-b text-xs text-slate-400 uppercase">
                            <th className="p-2">Título</th>
                            <th className="p-2">Precio</th>
                            <th className="p-2">Stock</th>
                            <th className="p-2 text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {products.map(p => (
                            <tr key={p.id}>
                              <td className="p-2 font-bold">{p.title}</td>
                              <td className="p-2">${p.price}</td>
                              <td className="p-2">
                                <button onClick={() => toggleStock(p.id, p.stock)} className={`px-2.5 py-1 rounded-full text-xs font-bold ${p.stock ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                  {p.stock ? 'En Stock' : 'Agotado'}
                                </button>
                              </td>
                              <td className="p-2 text-right space-x-2">
                                <button onClick={() => handleEditProduct(p)} className="text-purple-800 font-bold text-xs">Editar</button>
                                <button onClick={() => handleDeleteProduct(p.id)} className="text-rose-600 font-bold text-xs">Eliminar</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* NUEVO / EDITAR PRODUCTO */}
                    <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm">
                      <h3 className="text-xl font-bold mb-4">{productForm.id ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                      <form onSubmit={handleSaveProduct} className="space-y-4 text-sm">
                        <input type="text" placeholder="Título" value={productForm.title} onChange={e => setProductForm({...productForm, title: e.target.value})} className="w-full border p-2.5 rounded-xl" required />
                        <input type="number" placeholder="Precio ($)" value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} className="w-full border p-2.5 rounded-xl" required />
                        <input type="text" placeholder="URL de la Imagen (Link web)" value={productForm.images[0]} onChange={e => setProductForm({...productForm, images: [e.target.value]})} className="w-full border p-2.5 rounded-xl" />
                        <button type="submit" className="bg-purple-800 text-white px-6 py-2.5 rounded-xl font-bold">Guardar en la Nube</button>
                      </form>
                    </div>

                    {/* CARGA MASIVA JSON */}
                    <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm">
                      <h3 className="text-lg font-bold mb-2">📥 Carga Masiva JSON</h3>
                      <form onSubmit={handleBulkJsonImport} className="space-y-3">
                        <textarea rows="3" placeholder='[{"title":"Tela X","price":1200,"unit":"kilo","category":"Planos"}]' value={jsonInput} onChange={e => setJsonInput(e.target.value)} className="w-full border p-3 text-xs font-mono rounded-xl"></textarea>
                        <button type="submit" className="bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold">Importar</button>
                      </form>
                    </div>

                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
